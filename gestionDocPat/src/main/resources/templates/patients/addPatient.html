<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter un Patient</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h1>Ajouter un Patient</h1>

<!-- Formulaire lié à l'entité Patient -->
<form action="/patients/save" method="post" th:object="${patient}">
    <!-- Champ Nom -->
    <label for="name">Nom :</label>
    <input type="text" id="name" th:field="*{name}" required>
    <br>

    <!-- Champ Maladie -->
    <label for="disease">Maladie :</label>
    <input type="text" id="disease" th:field="*{disease}" required>
    <br>

    <!-- Champ Email (si présent dans l'entité) -->
    <label for="email">Email :</label>
    <input type="email" id="email" th:field="*{email}" required>
    <br>

    <!-- Bouton de soumission -->
    <button type="submit">Enregistrer</button>
</form>
</body>
</html>
