<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord | GreenPlanet</title>
    <link rel="stylesheet" href="/css/authStyle.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .plants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .plant-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
            background: white;
        }
        .plant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .plant-image {
            height: 200px;
            overflow: hidden;
        }
        .plant-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .plant-info {
            padding: 15px;
        }
        .plant-info h3 {
            margin: 0 0 10px;
            color: #2e7d32;
        }
        .plant-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            color: #666;
        }
        .reservation-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-reserve {
            display: inline-block;
            padding: 12px 25px;
            font-size: 16px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
        }
        .btn-reserve:hover {
            background-color: #1b5e20;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background-color: #e0f2f1;
            color: #00796b;
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-section">
            <img src="/images/logo.webp" alt="Logo GreenPlanet" class="logo">
            <h2>GreenPlanet</h2>
        </div>

        <nav class="nav-menu">
            <a href="/user/dashboard" class="active">
                <i class="fas fa-tachometer-alt"></i> Accueil
            </a>
            <a href="/user/plants">
                <i class="fas fa-leaf"></i> Plantes disponibles
            </a>
            <a href="/user/reservations">
                <i class="fas fa-calendar-check"></i> Mes réservations
            </a>
            <a th:href="@{/logout}">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="dashboard-header">
            <h1><i class="fas fa-home"></i> Tableau de bord</h1>
            <div class="user-info">
                <span th:text="${currentUser.username}"></span>
            </div>
        </header>

        <!-- Messages de succès/erreur -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Section Réservation -->
        <div class="reservation-section">
            <h2><i class="fas fa-calendar-plus"></i> Besoin d'une plante ?</h2>
            <p>Commencez votre processus de réservation en un seul clic !</p>
            <a href="/user/reserve" class="btn-reserve">
                <i class="fas fa-calendar-check"></i> Faire une réservation
            </a>
        </div>

        <!-- Section Plantes disponibles -->
        <div class="available-plants">
            <h2><i class="fas fa-seedling"></i> Plantes vedettes</h2>
            <div class="plants-grid">
                <div class="plant-card" th:each="plant : ${plants}">
                    <div class="plant-image">
                        <img th:if="${plant.image_filename}"
                             th:src="@{'/img/plant_img/' + ${plant.image_filename}}"
                             alt="Image de plante">
                        <div th:unless="${plant.image_filename}" class="no-image" style="height:100%; display:flex; align-items:center; justify-content:center; background:#f5f5f5;">
                            <i class="fas fa-leaf" style="font-size:3rem; color:#2e7d32;"></i>
                        </div>
                    </div>
                    <div class="plant-info">
                        <h3 th:text="${plant.name}">Nom de la plante</h3>
                        <p class="plant-category">
                            <span class="badge" th:text="${plant.category}"></span>
                        </p>
                        <p class="plant-description" th:text="${#strings.abbreviate(plant.description, 100)}"></p>
                        <div class="plant-meta">
                            <span><i class="fas fa-coins"></i> <span th:text="${#numbers.formatDecimal(plant.price, 1, 2, 'COMMA')} + ' TND'">0,00 TND</span></span>
                            <span><i class="fas fa-box-open"></i> <span th:text="${plant.quantity}">0</span> disponibles</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="view-all" style="margin-top: 20px; text-align: center;">
                <a href="/user/plants" class="btn btn-secondary" style="padding: 10px 20px;">
                    <i class="fas fa-leaf"></i> Voir toutes les plantes
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
