<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Réservations | GreenPlanet</title>
    <link rel="stylesheet" href="/css/authStyle.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .reservations-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .reservations-table th, .reservations-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .reservations-table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .reservations-table tr:hover {
            background-color: #f5f5f5;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-pending {
            background-color: #ffc107;
            color: #212529;
        }
        .status-approved {
            background-color: #28a745;
            color: white;
        }
        .status-rejected {
            background-color: #dc3545;
            color: white;
        }
        .status-completed {
            background-color: #17a2b8;
            color: white;
        }
        .action-btn {
            padding: 5px 10px;
            margin: 0 3px;
            border-radius: 4px;
            font-size: 14px;
        }
        .filter-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }
        .filter-select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .pagination {
            margin-top: 20px;
        }
        .pagination-info {
            margin-top: 10px;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Barre latérale -->
    <div class="sidebar">
        <div class="logo-section">
            <img src="/images/logo.webp" alt="Logo GreenPlanet" class="logo">
            <h2>GreenPlanet</h2>
        </div>
        <nav class="nav-menu">
            <a href="/admin/dashboard">
                <i class="fas fa-tachometer-alt"></i> Tableau de bord
            </a>
            <a href="/admin/plants">
                <i class="fas fa-leaf"></i> Gestion des plantes
            </a>
            <a href="/admin/reservations" class="active">
                <i class="fas fa-calendar-check"></i> Réservations
            </a>
            <a href="/admin/users">
                <i class="fas fa-users"></i> Gestion des utilisateurs
            </a>
            <a th:href="@{/logout}">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </nav>
    </div>

    <!-- Contenu principal -->
    <div class="main-content">
        <header class="dashboard-header">
            <h1><i class="fas fa-calendar-check"></i> Gestion des réservations</h1>
            <div class="user-info">
                <span th:text="${currentUser.username}"></span>
            </div>
        </header>

        <!-- Messages de succès/erreur -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="content-container">
            <div class="content-header">
                <h2>Liste des réservations</h2>
            </div>

            <!-- Filtre par statut -->
            <div class="filter-container">
                <form th:action="@{/admin/reservations}" method="get">
                    <input type="hidden" name="page" value="0">
                    <input type="hidden" name="size" th:value="${pageSize}">
                    <select name="status" class="filter-select" onchange="this.form.submit()">
                        <option value="">Tous les statuts</option>
                        <option th:each="status : ${statuses}"
                                th:value="${status}"
                                th:text="${status}"
                                th:selected="${statusFilter != null && statusFilter.equalsIgnoreCase(status.toString())}">
                        </option>
                    </select>
                </form>
            </div>

            <!-- Tableau des réservations -->
            <div class="table-responsive">
                <table class="reservations-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Client</th>
                        <th>Plante</th>
                        <th>Quantité</th>
                        <th>Date</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="reservation : ${reservationsPage.content}">
                        <td th:text="${reservation.id}"></td>
                        <td>
                            <div th:text="${reservation.fullName}"></div>
                            <small th:text="${reservation.phoneNumber}" class="text-muted"></small>
                        </td>
                        <td>
                            <div th:if="${reservation.plantDescription != null}"
                                 th:text="${#strings.abbreviate(reservation.plantDescription, 30)}"></div>
                            <div th:unless="${reservation.plantDescription != null}">Plante personnalisée</div>
                        </td>
                        <td th:text="${reservation.quantity}"></td>
                        <td th:text="${#temporals.format(reservation.reservationDate, 'dd MMM yyyy')}"></td>
                        <td>
                                <span th:classappend="'status-' + ${reservation.status.toString().toLowerCase()}"
                                      class="status-badge"
                                      th:text="${reservation.status}"></span>
                        </td>
                        <td>
                            <a th:href="@{'/admin/reservations/view/' + ${reservation.id}}"
                               class="btn btn-info action-btn" title="Voir">
                                <i class="fas fa-eye"></i>
                            </a>

                            <div class="btn-group" th:if="${reservation.status != T(com.pfe.GreenPlanet.model.ReservationStatus).COMPLETED}">
                                <button class="btn btn-success action-btn" title="Approuver"
                                        th:onclick="'updateStatus(' + ${reservation.id} + ',\'APPROVED\')'">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button class="btn btn-danger action-btn" title="Rejeter"
                                        th:onclick="'updateStatus(' + ${reservation.id} + ',\'REJECTED\')'">
                                    <i class="fas fa-times"></i>
                                </button>
                                <button class="btn btn-primary action-btn" title="Compléter"
                                        th:onclick="'updateStatus(' + ${reservation.id} + ',\'COMPLETED\')'">
                                    <i class="fas fa-flag-checkered"></i>
                                </button>
                            </div>

                            <a th:href="@{'/admin/reservations/delete/' + ${reservation.id}}"
                               class="btn btn-danger action-btn" title="Supprimer"
                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette réservation ?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${reservationsPage.content.isEmpty()}">
                        <td colspan="7" class="text-center text-muted">Aucune réservation trouvée</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${reservationsPage.totalPages > 1}" class="pagination-container">
                <div class="pagination-info">
                    Affichage de <span th:text="${reservationsPage.number * reservationsPage.size + 1}"></span> à
                    <span th:text="${(reservationsPage.number * reservationsPage.size) + reservationsPage.numberOfElements}"></span> sur
                    <span th:text="${reservationsPage.totalElements}"></span> réservations
                </div>

                <nav class="pagination">
                    <a th:href="@{'/admin/reservations?page=0&size=' + ${pageSize} + (${statusFilter} ? '&status=' + ${statusFilter} : '')}"
                       class="page-link" th:classappend="${reservationsPage.first} ? 'disabled'">
                        <i class="fas fa-angle-double-left"></i>
                    </a>
                    <a th:href="@{'/admin/reservations?page=' + (${reservationsPage.number}-1) + '&size=' + ${pageSize} + (${statusFilter} ? '&status=' + ${statusFilter} : '')}"
                       class="page-link" th:classappend="${reservationsPage.first} ? 'disabled'">
                        <i class="fas fa-angle-left"></i>
                    </a>

                    <a th:each="i : ${#numbers.sequence(0, reservationsPage.totalPages-1)}"
                       th:href="@{'/admin/reservations?page=' + ${i} + '&size=' + ${pageSize} + (${statusFilter} ? '&status=' + ${statusFilter} : '')}"
                       class="page-link" th:classappend="${i == reservationsPage.number} ? 'active'">
                        <span th:text="${i+1}"></span>
                    </a>

                    <a th:href="@{'/admin/reservations?page=' + (${reservationsPage.number}+1) + '&size=' + ${pageSize} + (${statusFilter} ? '&status=' + ${statusFilter} : '')}"
                       class="page-link" th:classappend="${reservationsPage.last} ? 'disabled'">
                        <i class="fas fa-angle-right"></i>
                    </a>
                    <a th:href="@{'/admin/reservations?page=' + (${reservationsPage.totalPages}-1) + '&size=' + ${pageSize} + (${statusFilter} ? '&status=' + ${statusFilter} : '')}"
                       class="page-link" th:classappend="${reservationsPage.last} ? 'disabled'">
                        <i class="fas fa-angle-double-right"></i>
                    </a>
                </nav>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function updateStatus(reservationId, status) {
        if (confirm('Êtes-vous sûr de vouloir modifier le statut de cette réservation ?')) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/admin/reservations/update-status/' + reservationId;

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'status';
            input.value = status;

            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        }
    }
</script>
</body>
</html>
