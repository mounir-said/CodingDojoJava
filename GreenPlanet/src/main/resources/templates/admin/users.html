<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des utilisateurs | GreenPlanet</title>
    <link rel="stylesheet" href="/css/authStyle.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .users-table th, .users-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .users-table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .users-table tr:hover {
            background-color: #f5f5f5;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-primary {
            background-color: #007bff;
            color: white;
        }
        .badge-secondary {
            background-color: #6c757d;
            color: white;
        }
        .action-btn {
            padding: 5px 10px;
            margin: 0 3px;
            border-radius: 4px;
            font-size: 14px;
        }
        .pagination {
            margin-top: 20px;
        }
        .pagination-info {
            margin-top: 10px;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-section">
            <img src="/images/logo.webp" alt="Logo GreenPlanet" class="logo">
            <h2>GreenPlanet</h2>
        </div>
        <nav class="nav-menu">
            <a href="/admin/dashboard">
                <i class="fas fa-tachometer-alt"></i> Tableau de bord
            </a>
            <a href="/admin/plants">
                <i class="fas fa-leaf"></i> Gestion des plantes
            </a>
            <a href="/admin/reservations">
                <i class="fas fa-calendar-check"></i> Réservations
            </a>
            <a href="/admin/users" class="active">
                <i class="fas fa-users"></i> Gestion des utilisateurs
            </a>
            <a th:href="@{/logout}">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="dashboard-header">
            <h1><i class="fas fa-users"></i> Gestion des utilisateurs</h1>
            <div class="user-info">
                <span th:text="${currentUser.username}"></span>
            </div>
        </header>

        <!-- Messages de succès/erreur -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="content-container">
            <div class="content-header">
                <h2>Liste des utilisateurs</h2>
            </div>

            <!-- Tableau des utilisateurs -->
            <div class="table-responsive">
                <table class="users-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom d'utilisateur</th>
                        <th>Email</th>
                        <th>Rôle</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${usersPage.content}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                                <span th:text="${user.role == 'ADMIN' ? 'ADMINISTRATEUR' : 'UTILISATEUR'}"
                                      th:classappend="${user.role == 'ADMIN'} ? 'badge badge-primary' : 'badge badge-secondary'"></span>
                        </td>
                        <td>
                            <a th:href="@{'/admin/users/delete/' + ${user.id}}"
                               class="btn btn-danger action-btn" title="Supprimer"
                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${usersPage.content.isEmpty()}">
                        <td colspan="5" class="text-center text-muted">Aucun utilisateur trouvé</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${usersPage.totalPages > 1}" class="pagination-container">
                <div class="pagination-info">
                    Affichage de <span th:text="${usersPage.number * usersPage.size + 1}"></span> à
                    <span th:text="${(usersPage.number * usersPage.size) + usersPage.numberOfElements}"></span> sur
                    <span th:text="${usersPage.totalElements}"></span> utilisateurs
                </div>

                <nav class="pagination">
                    <a th:href="@{'/admin/users?page=0&size=' + ${pageSize}}"
                       class="page-link" th:classappend="${usersPage.first} ? 'disabled'">
                        <i class="fas fa-angle-double-left"></i>
                    </a>
                    <a th:href="@{'/admin/users?page=' + (${usersPage.number}-1) + '&size=' + ${pageSize}}"
                       class="page-link" th:classappend="${usersPage.first} ? 'disabled'">
                        <i class="fas fa-angle-left"></i>
                    </a>

                    <a th:each="i : ${#numbers.sequence(0, usersPage.totalPages-1)}"
                       th:href="@{'/admin/users?page=' + ${i} + '&size=' + ${pageSize}}"
                       class="page-link" th:classappend="${i == usersPage.number} ? 'active'">
                        <span th:text="${i+1}"></span>
                    </a>

                    <a th:href="@{'/admin/users?page=' + (${usersPage.number}+1) + '&size=' + ${pageSize}}"
                       class="page-link" th:classappend="${usersPage.last} ? 'disabled'">
                        <i class="fas fa-angle-right"></i>
                    </a>
                    <a th:href="@{'/admin/users?page=' + (${usersPage.totalPages}-1) + '&size=' + ${pageSize}}"
                       class="page-link" th:classappend="${usersPage.last} ? 'disabled'">
                        <i class="fas fa-angle-double-right"></i>
                    </a>
                </nav>
            </div>

            <!-- Retour au tableau de bord -->
            <div class="text-end mt-3">
                <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Retour au tableau de bord
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
