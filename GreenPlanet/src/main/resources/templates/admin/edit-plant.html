<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier la plante | GreenPlanet</title>
    <link rel="stylesheet" href="/css/authStyle.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .edit-plant-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        textarea.form-control {
            min-height: 120px;
        }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .image-preview-container {
            margin-top: 10px;
        }
        .image-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-primary:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .current-value, .current-price {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 0.9em;
        }
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
        }
        .alert-error {
            color: #a94442;
            background-color: #f2dede;
            border-color: #ebccd1;
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Barre latérale -->
    <div class="sidebar">
        <div class="logo-section">
            <img src="/images/logo.webp" alt="Logo GreenPlanet" class="logo">
            <h2>GreenPlanet</h2>
        </div>
        <nav class="nav-menu">
            <a href="/admin/dashboard">
                <i class="fas fa-tachometer-alt"></i> Tableau de bord
            </a>
            <a href="/admin/plants" class="active">
                <i class="fas fa-leaf"></i> Gestion des plantes
            </a>
            <a href="/admin/reservations">
                <i class="fas fa-calendar-check"></i> Réservations
            </a>
            <a href="/admin/users">
                <i class="fas fa-users"></i> Gestion des utilisateurs
            </a>
            <a th:href="@{/logout}">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </nav>
    </div>

    <!-- Contenu principal -->
    <div class="main-content">
        <header class="dashboard-header">
            <h1><i class="fas fa-edit"></i> Modifier la plante</h1>
            <div class="user-info">
                <span th:text="${currentUser.username}"></span>
            </div>
        </header>

        <!-- Messages d'erreur -->
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="edit-plant-container" th:if="${plant != null}">
            <form th:action="@{'/admin/plants/update/' + ${plant.id}}"
                  method="post"
                  enctype="multipart/form-data"
                  th:object="${plantDto}">

                <!-- Nom -->
                <div class="form-group">
                    <label for="name">Nom de la plante</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required>
                    <small class="current-value">
                        Actuel : <span th:text="${plant.name}"></span>
                    </small>
                    <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                </div>

                <!-- Catégorie -->
                <div class="form-group">
                    <label for="category">Catégorie</label>
                    <select id="category" th:field="*{category}" class="form-control" required>
                        <option value="">Sélectionnez une catégorie</option>
                        <option value="Flowers">Fleurs</option>
                        <option value="Trees">Arbres</option>
                        <option value="Shrubs">Arbustes</option>
                        <option value="Vegetables">Légumes</option>
                        <option value="Herbs">Herbes</option>
                    </select>
                    <small class="current-value">
                        Actuelle : <span th:text="${plant.category}"></span>
                    </small>
                    <small class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></small>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" class="form-control" required></textarea>
                    <small class="current-value">
                        Actuelle : <span th:text="${plant.description}"></span>
                    </small>
                    <small class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small>
                </div>

                <div class="form-row">
                    <!-- Prix -->
                    <div class="form-group">
                        <label for="price">Prix (TND)</label>
                        <input type="number" id="price" th:field="*{price}" class="form-control" step="0.01" min="0" required>
                        <small class="current-price">
                            Actuel : <span th:text="${#numbers.formatDecimal(plant.price, 1, 2) + ' TND'}"></span>
                        </small>
                        <small class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
                    </div>

                    <!-- Quantité -->
                    <div class="form-group">
                        <label for="quantity">Quantité en stock</label>
                        <input type="number" id="quantity" th:field="*{quantity}" class="form-control" min="0" required>
                        <small class="current-value">
                            Actuelle : <span th:text="${plant.quantity}"></span>
                        </small>
                        <small class="text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></small>
                    </div>
                </div>

                <!-- Image actuelle -->
                <div class="form-group">
                    <label>Image actuelle</label>
                    <div class="image-preview-container">
                        <img th:src="@{'/img/plant_img/' + ${plant.image_filename}}"
                             class="image-preview" id="currentImagePreview">
                    </div>
                </div>

                <!-- Nouvelle image -->
                <div class="form-group">
                    <label for="image">Changer l'image (optionnel)</label>
                    <input type="file" id="image" name="image" class="form-control"
                           accept="image/*" onchange="previewImage(this)">
                    <small class="text-muted">Laisser vide pour conserver l'image actuelle</small>
                    <div id="newImagePreview" style="display: none; margin-top: 10px;">
                        <img id="preview" class="image-preview">
                    </div>
                </div>

                <input type="hidden" name="currentImage" th:value="${plant.image_filename}">

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Mettre à jour
                    </button>
                    <a th:href="@{/admin/plants}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Annuler
                    </a>
                </div>
            </form>
        </div>

        <div th:unless="${plant != null}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            Plante non trouvée !
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function previewImage(input) {
        const preview = document.getElementById('preview');
        const previewContainer = document.getElementById('newImagePreview');

        if (input.files && input.files[0]) {
            const reader = new FileReader();

            reader.onload = function(e) {
                preview.src = e.target.result;
                previewContainer.style.display = 'block';
            }

            reader.readAsDataURL(input.files[0]);
        } else {
            previewContainer.style.display = 'none';
        }
    }
</script>
</body>
</html>
