<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="UTF-8">
	<title>Page du Panier</title>
</head>
<body>
<section>
	<div class="container mt-5 p-5">
		<div class="row">
			<p class="text-center fs-3 mb-4">Page du Panier</p>

			<th:block th:if="${session.succMsg}">
				<p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
				<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
			</th:block>

			<th:block th:if="${session.errorMsg}">
				<p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
				<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
			</th:block>

			<div class="col-md-12">
				<div class="card card-sh">
					<div class="card-body">
						<div class="table-responsive">
							<table class="table table-bordered table-hover align-middle">
								<thead class="table-light">
								<tr>
									<th scope="col" style="width: 5%">N°</th>
									<th scope="col" style="width: 15%">Image</th>
									<th scope="col" style="width: 30%">Produit</th>
									<th scope="col" style="width: 15%">Prix Unitaire</th>
									<th scope="col" style="width: 20%">Quantité</th>
									<th scope="col" style="width: 15%">Total</th>
								</tr>
								</thead>
								<tbody>
								<tr th:each="cart,c:${carts}">
									<td class="fw-semibold">[[${c.count}]]</td>
									<td>
										<img th:src="@{'/img/product_img/'+${cart.product.image}}"
											 class="img-thumbnail"
											 style="width: 70px; height: 70px; object-fit: contain">
									</td>
									<td>[[${cart.product.title}]]</td>
									<td>[[${cart.product.discountPrice}]] DT</td>
									<td class="text-center">
										<div class="d-flex align-items-center justify-content-center gap-2">
											<a th:href="@{'/user/cartQuantityUpdate?sy=de&cid='+${cart.id}}"
											   class="btn btn-sm btn-outline-secondary">
												<i class="fa-solid fa-minus"></i>
											</a>
											<span class="fw-medium">[[${cart.quantity}]]</span>
											<a th:href="@{'/user/cartQuantityUpdate?sy=in&cid='+${cart.id}}"
											   class="btn btn-sm btn-outline-secondary">
												<i class="fa-solid fa-plus"></i>
											</a>
										</div>
									</td>
									<td class="fw-semibold">[[${cart.totalPrice}]] DT</td>
								</tr>
								<tr class="table-group-divider">
									<td colspan="4"></td>
									<td class="fw-bold text-end">Total Général:</td>
									<td class="fw-bold">[[${totalOrderPrice}]] DT</td>
								</tr>
								</tbody>
							</table>
						</div>

						<div class="text-center mt-4">
							<a href="/user/orders" class="btn btn-danger btn-lg">
								Procéder au Paiement
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
</body>
</html>
