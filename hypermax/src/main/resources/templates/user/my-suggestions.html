<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Mes Suggestions</title>
</head>
<body>
<section>
    <div class="container p-5 mt-3">
        <div class="row">
            <div class="col-md-10 offset-md-1">
                <div class="card card-sh">
                    <div class="card-header text-center">
                        <p class="fs-4"><i class="fas fa-list me-2"></i>Mes Suggestions</p>
                    </div>

                    <div class="card-body">
                        <div th:if="${postsPage.empty}">
                            <div class="alert alert-info text-center">
                                <i class="fas fa-info-circle me-2"></i>
                                Aucune suggestion trouvée
                            </div>
                        </div>

                        <div th:each="post : ${postsPage.content}" class="mb-4">
                            <div class="card shadow-sm">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h5 class="mb-0">[[${post.title}]]</h5>
                                    <span class="badge"
                                          th:classappend="${post.status.name() == 'PENDING' ? 'bg-warning' :
                      (post.status.name() == 'APPROVED' ? 'bg-success' : 'bg-danger')}">
    [[${post.status}]]
</span>
                                </div>

                                <div class="card-body">
                                    <p class="text-muted small mb-3">
                                        <i class="fas fa-clock me-2"></i>
                                        [[${#temporals.format(post.createdAt, 'dd MMM yyyy à HH:mm')}]]
                                    </p>
                                    <p class="mb-0">[[${post.content}]]</p>
                                </div>
                            </div>
                        </div>

                        <!-- Fixed pagination -->
                        <nav th:if="${postsPage.totalPages > 1}" class="mt-4">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${postsPage.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/user/my-suggestions(page=0)}">
                                        <i class="fas fa-angle-double-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:classappend="${postsPage.number == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/user/my-suggestions(page=${postsPage.number-1})}">
                                        <i class="fas fa-angle-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(1, postsPage.totalPages)}"
                                    th:classappend="${postsPage.number + 1 == i} ? 'active'">
                                    <a class="page-link" th:href="@{/user/my-suggestions(page=${i-1})}">
                                        [[${i}]]
                                    </a>
                                </li>
                                <li class="page-item" th:classappend="${postsPage.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/user/my-suggestions(page=${postsPage.number+1})}">
                                        <i class="fas fa-angle-right"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:classappend="${postsPage.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/user/my-suggestions(page=${postsPage.totalPages-1})}">
                                        <i class="fas fa-angle-double-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
