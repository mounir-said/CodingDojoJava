<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
	  th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="UTF-8">
	<title>Connexion</title>
</head>
<body>
<section>

	<div class="container mt-5 p-5">
		<div class="row">
			<div class="col-md-6 p-5">
				<img alt="Image e-commerce" src="img/logo.png" width="100%" height="400px">
			</div>
			<div class="col-md-6 mt-3 p-5">
				<div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
					<div class="card-header">
						<p class="fs-4 text-center">Connexion</p>
						<div th:if="${param.error}" class="alert alert-danger text-center">
							<th:block th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null}">
								[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]
							</th:block>
						</div>

						<div th:if="${param.logout}" class="alert alert-success text-center">
							Déconnexion réussie
						</div>
					</div>

					<div class="card-body">
						<form action="/login" method="post">
							<div class="mb-3">
								<label class="form-label">Adresse email</label>
								<input required class="form-control" name="username" type="email">
							</div>

							<div class="mb-3">
								<label class="form-label">Mot de passe</label>
								<input required class="form-control" name="password" type="password">
							</div>

							<button type="submit" class="btn bg-primary text-white col-md-12">
								Se connecter
							</button>
						</form>
					</div>

					<div class="card-footer text-center">
						<a href="/forgot-password" class="text-decoration-none">Mot de passe oublié ?</a><br>
						Vous n'avez pas de compte ? <a href="/register" class="text-decoration-none">Créer un compte</a>
					</div>
				</div>
			</div>
		</div>
	</div>

</section>
</body>
</html>
