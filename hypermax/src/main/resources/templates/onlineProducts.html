<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">E-Commerce Product Search</h1>

    <!-- Search Form -->
    <form th:action="@{/onlineProducts/search}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Search onlineProducts...">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>

    <!-- Product Table -->
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Image</th>
            <th>Title</th>
            <th>Price</th>
            <th>Source</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="onlineProduct : ${onlineProducts}">
            <td>
                <img th:src="${onlineProduct.imageUrl}" width="100" th:alt="${onlineProduct.title}">
            </td>
            <td>
                <a th:href="${onlineProduct.url}" th:text="${onlineProduct.title}"></a>
                <p class="text-muted" th:text="${onlineProduct.description}"></p>
            </td>
            <td th:text="${onlineProduct.price}"></td>
            <td th:text="${onlineProduct.source}"></td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
