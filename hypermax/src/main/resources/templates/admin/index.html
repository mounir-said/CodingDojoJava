<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="UTF-8">
	<title>Tableau de bord Administrateur</title>
	<link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>
<body>
<section>
	<div class="container p-5">
		<p class="text-center fs-3 mt-4">Tableau de bord Administrateur</p>
		<div class="row p-5">
			<div class="col-md-4 mt-2">
				<a href="/admin/loadAddProduct" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-primary">
							<i class="fa-solid fa-square-plus fa-3x"></i>
							<h4>Ajouter un Produit</h4>
						</div>
					</div>
				</a>
			</div>

			<div class="col-md-4 mt-2">
				<a href="/admin/category" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-warning">
							<i class="fa-solid fa-list fa-3x"></i>
							<h4>Ajouter une Catégorie</h4>
						</div>
					</div>
				</a>
			</div>

			<div class="col-md-4 mt-2">
				<a href="/admin/products" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-success">
							<i class="fa-solid fa-table-list fa-3x"></i>
							<h4>Voir les Produits</h4>
						</div>
					</div>
				</a>
			</div>

			<div class="col-md-4 mt-4">
				<a href="/admin/orders" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-warning">
							<i class="fa-solid fa-box-open fa-3x"></i>
							<h4>Commandes</h4>
						</div>
					</div>
				</a>
			</div>

			<div class="col-md-4 mt-4">
				<a href="/admin/users?type=1" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-primary">
							<i class="fa-solid fa-circle-user fa-3x"></i>
							<h4>Utilisateurs</h4>
						</div>
					</div>
				</a>
			</div>

			<div class="col-md-4 mt-4">
				<a href="/admin/add-admin" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-primary">
							<i class="fa-solid fa-user-plus fa-3x"></i>
							<h4>Ajouter un Admin</h4>
						</div>
					</div>
				</a>
			</div>

			<div class="col-md-4 mt-4">
				<a href="/admin/users?type=2" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-primary">
							<i class="fa-solid fa-circle-user fa-3x"></i>
							<h4>Admins</h4>
						</div>
					</div>
				</a>
			</div>

			<!-- New Search History Card -->
			<div class="col-md-4 mt-4">
				<a href="/admin/search-history" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-info">
							<i class="fa-solid fa-magnifying-glass fa-3x"></i>
							<h4>Recherche Historique</h4>
						</div>
					</div>
				</a>
			</div>

			<!-- New AI-Assisted Search Card -->
			<div class="col-md-4 mt-4">
				<a href="/admin/search-engine/" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-info">
							<i class="fa-solid fa-robot fa-3x"></i>
							<h4>Recherche assistée par IA</h4>
						</div>
					</div>
				</a>
			</div>

			<!-- New Analytics Card -->
			<div class="col-md-4 mt-4">
				<a href="/admin/online-products/analytics" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-secondary">
							<i class="fa-solid fa-chart-line fa-3x"></i>
							<h4>Analyse des Produits</h4>
						</div>
					</div>
				</a>
			</div>

			<!-- New Online Products Card -->
			<div class="col-md-4 mt-4">
				<a href="/admin/online-products" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-success">
							<i class="fa-solid fa-globe fa-3x"></i>
							<h4>Produits en Ligne</h4>
						</div>
					</div>
				</a>
			</div>

			<div class="col-md-4 mt-4">
				<a href="/admin/suggestions" class="text-decoration-none">
					<div class="card card-sh">
						<div class="card-body text-center text-info">
							<i class="fa-solid fa-comments fa-3x"></i>
							<h4>Suggestions des Utilisateurs</h4>
							<small class="text-muted">Voir les posts et suggestions</small>
						</div>
					</div>
				</a>
			</div>

		</div>
	</div>
</section>
</body>
</html>
