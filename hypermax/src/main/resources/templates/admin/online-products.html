<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{base::layout(~{::section})}">
<head>
    <title>Produits en Ligne Sauvegardés</title>
    <style>
        .image-container {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            padding: 5px;
        }

        .product-img[src*="default-product.png"] {
            opacity: 0.7;
            padding: 15px;
        }

        .description {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .price {
            font-weight: bold;
            color: #28a745;
        }

        .sort-arrows {
            display: inline-flex;
            flex-direction: column;
            margin-left: 5px;
        }

        .sort-arrows a {
            line-height: 0.8;
            color: #6c757d;
            transition: color 0.2s;
        }

        .sort-arrows a:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>
<section>
    <div class="container p-5">
        <div class="row mb-4">
            <div class="col">
                <h1 class="text-center fs-3 mt-4">
                    <i class="fas fa-globe"></i> Produits en Ligne Sauvegardés
                </h1>
                <p class="text-center text-muted">Total: <span th:text="${totalItems}"></span> produits trouvés</p>
            </div>
        </div>

        <!-- Search Form -->
        <div class="row mb-4">
            <div class="col-md-8">
                <form th:action="@{/admin/online-products/search}" method="get" class="input-group">
                    <input type="text" name="query" class="form-control"
                           placeholder="Rechercher par titre..." th:value="${searchQuery}">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search"></i> Rechercher
                    </button>
                    <a th:href="@{/admin/online-products}" class="btn btn-outline-secondary">
                        <i class="fas fa-sync-alt"></i> Réinitialiser
                    </a>
                </form>
            </div>
            <div class="col-md-4 text-end">
                <a th:href="@{/admin/online-products/analytics}" class="btn btn-info">
                    <i class="fas fa-chart-line"></i> Analytics
                </a>
            </div>
        </div>

        <!-- Products Table -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>Image</th>
                            <th>Titre
                                <span class="sort-arrows">
                                    <a th:href="@{/admin/online-products/(page=0,size=${totalItems},sort=title,asc)}">
                                        <i class="fas fa-arrow-up"></i>
                                    </a>
                                    <a th:href="@{/admin/online-products/(page=0,size=${totalItems},sort=title,desc)}">
                                        <i class="fas fa-arrow-down"></i>
                                    </a>
                                </span>
                            </th>
                            <th>Description</th>
                            <th>Prix
                                <span class="sort-arrows">
                                    <a th:href="@{/admin/online-products/(page=0,size=${totalItems},sort=price,asc)}">
                                        <i class="fas fa-arrow-up"></i>
                                    </a>
                                    <a th:href="@{/admin/online-products/(page=0,size=${totalItems},sort=price,desc)}">
                                        <i class="fas fa-arrow-down"></i>
                                    </a>
                                </span>
                            </th>
                            <th>Source</th>
                            <th>Date
                                <span class="sort-arrows">
                                    <a th:href="@{/admin/online-products/(page=0,size=${totalItems},sort=timestamp,asc)}">
                                        <i class="fas fa-arrow-up"></i>
                                    </a>
                                    <a th:href="@{/admin/online-products/(page=0,size=${totalItems},sort=timestamp,desc)}">
                                        <i class="fas fa-arrow-down"></i>
                                    </a>
                                </span>
                            </th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="product : ${products}">
                            <td>
                                <div class="image-container">
                                    <img th:src="${product.imageUrl}"
                                         class="product-img"
                                         onerror="this.src='/img/default-product.png'">
                                </div>
                            </td>
                            <td>
                                <a th:href="${product.url}" target="_blank" th:text="${product.title}"></a>
                            </td>
                            <td class="description" th:text="${product.description}"></td>
                            <td class="price" th:text="${product.price != null ? '€' + product.price : 'N/A'}"></td>
                            <td th:text="${product.source}"></td>
                            <td th:text="${#temporals.format(product.timestamp, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <a th:href="${product.url}" target="_blank" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-external-link-alt"></i>
                                </a>
                                <a th:href="@{/admin/online-products/delete/{id}(id=${product.id})}"
                                   class="btn btn-sm btn-outline-danger">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav th:if="${totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/online-products/(page=0,size=${size},sort=${sortField + ',' + sortDirection})}">
                                <i class="fas fa-angle-double-left"></i>
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/online-products/(page=${currentPage - 1},size=${size},sort=${sortField + ',' + sortDirection})}">
                                <i class="fas fa-angle-left"></i>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/admin/online-products/(page=${i},size=${size},sort=${sortField + ',' + sortDirection})}"
                               th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/online-products/(page=${currentPage + 1},size=${size},sort=${sortField + ',' + sortDirection})}">
                                <i class="fas fa-angle-right"></i>
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/online-products/(page=${totalPages - 1},size=${size},sort=${sortField + ',' + sortDirection})}">
                                <i class="fas fa-angle-double-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</section>
</body>
</html>
