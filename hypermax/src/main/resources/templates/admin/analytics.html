<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Analytics des Produits</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .analytics-card {
            transition: all 0.3s ease;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .analytics-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
    </style>
</head>
<body>
<section>
    <div class="container p-5">
        <div class="row mb-4">
            <div class="col">
                <h1 class="text-center fs-3 mt-4">
                    <i class="fas fa-chart-line"></i> Analytics des Produits
                </h1>
                <p class="text-center text-muted">Statistiques et analyses des produits en ligne</p>
                <div class="text-center mt-3">
                    <a th:href="@{/admin/online-products}" class="btn btn-outline-primary">
                        <i class="fas fa-arrow-left"></i> Retour aux produits
                    </a>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Cartes de résumé -->
            <div class="col-md-4 mb-4">
                <div class="card text-white bg-primary analytics-card h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">
                            <i class="fas fa-box-open"></i> Total Produits
                        </h5>
                        <h2 class="card-text" th:text="${totalProducts}"></h2>
                        <p class="mb-0">Produits enregistrés</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card text-white bg-success analytics-card h-100">
                    <div class="card-body">
                        <h5 class="card-title text-center">
                            <i class="fas fa-store"></i> Sources
                        </h5>
                        <ul class="list-unstyled">
                            <li th:each="source : ${distinctSources}" th:text="${source}"></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card text-white bg-info analytics-card h-100">
                    <div class="card-body">
                        <h5 class="card-title text-center">
                            <i class="fas fa-clock"></i> Derniers Ajouts
                        </h5>
                        <ul class="list-unstyled">
                            <li th:each="product : ${latestProducts}">
                                <a th:href="${product.url}" target="_blank"
                                   class="text-white" th:text="${product.title}"></a>
                                <small th:text="${#temporals.format(product.timestamp, 'dd/MM HH:mm')}"></small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Graphique de distribution des prix -->
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-euro-sign"></i> Distribution des Prix
                </h5>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Graphique de répartition par source -->
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-chart-pie"></i> Répartition par Source
                </h5>
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="sourceChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Données injectées depuis le contrôleur
        const priceData = JSON.parse('[(${priceDistribution})]');
        const sourceData = JSON.parse('[(${sourceDistribution})]');

        // Configuration du graphique des prix
        const priceCtx = document.getElementById('priceChart').getContext('2d');
        new Chart(priceCtx, {
            type: 'line',
            data: {
                labels: priceData.map(d => d.range),
                datasets: [{
                    label: 'Nombre de produits',
                    data: priceData.map(d => d.count),
                    borderColor: '#4e73df',
                    backgroundColor: 'rgba(78, 115, 223, 0.05)',
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: (context) => `${context.parsed.y} produits`
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Nombre de produits' }
                    },
                    x: {
                        title: { display: true, text: 'Tranches de prix' }
                    }
                }
            }
        });

        // Configuration du graphique des sources
        const sourceCtx = document.getElementById('sourceChart').getContext('2d');
        new Chart(sourceCtx, {
            type: 'pie',
            data: {
                labels: Object.keys(sourceData),
                datasets: [{
                    data: Object.values(sourceData),
                    backgroundColor: [
                        '#4e73df', '#1cc88a', '#36b9cc',
                        '#f6c23e', '#e74a3b', '#858796'
                    ],
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { padding: 20 }
                    },
                    tooltip: {
                        callbacks: {
                            label: (context) => {
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const value = context.parsed;
                                const percentage = ((value / total) * 100).toFixed(1);
                                return `${context.label}: ${value} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
