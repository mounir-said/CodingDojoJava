<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Historique de Recherche</title>
    <style>
        .search-entry {
            margin-bottom: 2rem;
            padding: 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            background-color: #f8f9fa;
        }
        .search-header {
            font-weight: bold;
            margin-bottom: 1rem;
            color: #0d6efd;
        }
        .search-result {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background-color: white;
            border-radius: 0.25rem;
        }
        .search-url {
            color: #0d6efd;
            text-decoration: none;
        }
        .search-url:hover {
            text-decoration: underline;
        }
        .error-message {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
<section>
    <div class="container-fluid mt-5 p-5 bg-light">
        <div class="row">
            <div class="col-md-10 offset-md-1">
                <p class="fs-3 text-center">Historique de Recherche</p>

                <th:block th:if="${session.succMsg}">
                    <p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
                    <th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
                </th:block>

                <th:block th:if="${session.errorMsg}">
                    <p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
                    <th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
                </th:block>

                <hr>

                <div class="card shadow">
                    <div class="card-body">
                        <div th:if="${searchEntries.size() == 1 and (searchEntries[0].startsWith('Error') or searchEntries[0].startsWith('Search history file not found'))}">
                            <p class="error-message text-center" th:text="${searchEntries[0]}"></p>
                        </div>
                        <div th:if="${searchEntries.size() == 1 and searchEntries[0] == 'No search history found'}">
                            <p class="text-center">Aucun historique de recherche trouvé</p>
                        </div>
                        <div th:unless="${searchEntries.size() == 1 and (searchEntries[0].startsWith('Error') or searchEntries[0].startsWith('Search history file not found') or searchEntries[0] == 'No search history found')}">
                            <div th:each="entry : ${searchEntries}" class="search-entry">
                                <div class="search-header" th:utext="${'Requête: ' + entry.split('\n')[0]}"></div>
                                <div th:each="line : ${entry.split('\n')}"
                                     th:if="${!line.startsWith('===') && !line.trim().isEmpty() && !line.startsWith('Query:')}"
                                     class="search-result">
                                    <div th:if="${line.startsWith('URL:')}">
                                        <a th:href="${line.substring(5)}" class="search-url" th:text="${line.substring(5)}" target="_blank"></a>
                                    </div>
                                    <div th:if="${line.startsWith('Description:')}" th:utext="${line.substring(12)}"></div>
                                    <div th:if="${!line.startsWith('URL:') && !line.startsWith('Description:')}" th:text="${line}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
