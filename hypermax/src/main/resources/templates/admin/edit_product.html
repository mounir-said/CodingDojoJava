<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="UTF-8">
	<title>Modifier le produit</title>
	<style>
		.product-image {
			max-width: 200px;
			height: auto;
			border: 2px solid #dee2e6;
			border-radius: 0.25rem;
			transition: transform 0.2s;
		}
		.product-image:hover {
			transform: scale(1.05);
		}
		.image-preview-container {
			text-align: center;
			margin: 1rem 0;
		}
		.form-section {
			background-color: #f8f9fa;
			border-radius: 0.5rem;
			padding: 1.5rem;
			margin-bottom: 1.5rem;
		}
	</style>
</head>
<body>
<section>
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-10">
				<div class="card shadow-lg">
					<div class="card-header bg-primary text-white text-center py-3">
						<h3 class="mb-0">Modifier le produit</h3>
					</div>

					<div class="card-body p-4">
						<!-- Alert Messages -->
						<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
							[[${session.succMsg}]]
							<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
						</div>
						<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
							[[${session.errorMsg}]]
							<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
						</div>

						<form th:action="@{/admin/updateProduct}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
							<input type="hidden" name="id" th:value="${product.id}">

							<!-- Basic Information Section -->
							<div class="form-section">
								<h5 class="mb-4 text-primary">Informations de base</h5>
								<div class="row g-3">
									<div class="col-md-6">
										<label class="form-label">Titre du produit</label>
										<input type="text" name="title" th:value="${product.title}"
											   class="form-control" required>
									</div>
									<div class="col-md-6">
										<label class="form-label">Catégorie</label>
										<select class="form-select" name="category" required>
											<option th:value="${product.category}" th:text="${product.category}" selected></option>
											<option th:each="c : ${categories}" th:value="${c.name}" th:text="${c.name}"></option>
										</select>
									</div>
									<div class="col-12">
										<label class="form-label">Description</label>
										<textarea class="form-control" name="description"
												  rows="3" th:text="${product.description}" required></textarea>
									</div>
								</div>
							</div>

							<!-- Pricing Section -->
							<div class="form-section">
								<h5 class="mb-4 text-primary">Prix et remise</h5>
								<div class="row g-3">
									<div class="col-md-4">
										<label class="form-label">Prix (TND)</label>
										<input type="number" name="price" th:value="${product.price}"
											   class="form-control" step="0.01" required>
									</div>
									<div class="col-md-4">
										<label class="form-label">Remise (%)</label>
										<input type="number" name="discount" th:value="${product.discount}"
											   class="form-control" min="0" max="100" required>
									</div>
									<div class="col-md-4">
										<label class="form-label">Prix après remise</label>
										<input type="number" th:value="${product.discountPrice}"
											   class="form-control" readonly>
									</div>
								</div>
							</div>

							<!-- Inventory & Image Section -->
							<div class="form-section">
								<h5 class="mb-4 text-primary">Stock et image</h5>
								<div class="row g-3 align-items-center">
									<div class="col-md-4">
										<label class="form-label">Stock disponible</label>
										<input type="number" name="stock" th:value="${product.stock}"
											   class="form-control" required>
									</div>
									<div class="col-md-8">
										<label class="form-label">Image du produit</label>
										<input type="file" name="file" class="form-control" accept="image/*">
									</div>
									<div class="col-12">
										<div class="image-preview-container">
											<img th:src="@{'/uploads/product_img/' + ${product.image}}"
												 class="product-image img-thumbnail"
												 onerror="this.onerror=null;this.src='/images/default-product.png';"
												 alt="Aperçu de l'image du produit">
										</div>
									</div>
								</div>
							</div>

							<!-- Status Section -->
							<div class="form-section">
								<h5 class="mb-4 text-primary">Statut du produit</h5>
								<div class="d-flex gap-4">
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											   id="activeTrue" value="true" th:checked="${product.isActive}">
										<label class="form-check-label text-success fw-medium" for="activeTrue">
											Activer le produit
										</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											   id="activeFalse" value="false" th:checked="${!product.isActive}">
										<label class="form-check-label text-danger fw-medium" for="activeFalse">
											Désactiver le produit
										</label>
									</div>
								</div>
							</div>

							<!-- Submit Button -->
							<div class="d-grid gap-2 mt-4">
								<button type="submit" class="btn btn-primary btn-lg">
									<i class="bi bi-save me-2"></i>Mettre à jour
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
</body>
</html>
