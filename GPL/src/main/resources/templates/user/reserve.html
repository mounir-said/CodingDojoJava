<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faire une réservation | GreenPlanet</title>
    <link rel="stylesheet" href="/css/authStyle.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .reservation-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        textarea.form-control {
            min-height: 100px;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            background-color: #ffebee;
            color: #c62828;
        }

        .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .btn-reserve {
            background-color: #2e7d32;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reserve:hover {
            background-color: #1b5e20;
        }

        .text-danger {
            color: #c62828;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-section">
            <img src="/images/logo.webp" alt="Logo GreenPlanet" class="logo">
            <h2>GreenPlanet</h2>
        </div>

        <nav class="nav-menu">
            <a href="/user/dashboard">
                <i class="fas fa-tachometer-alt"></i> Accueil
            </a>
            <a href="/user/plants">
                <i class="fas fa-leaf"></i> Plantes disponibles
            </a>
            <a href="/user/reservations" class="active">
                <i class="fas fa-calendar-check"></i> Mes réservations
            </a>
            <a th:href="@{/logout}">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="dashboard-header">
            <h1><i class="fas fa-calendar-plus"></i> Faire une réservation</h1>
            <div class="user-info">
                <span th:text="${currentUser.username}"></span>
            </div>
        </header>

        <!-- Success Message -->
        <div th:if="${param.success}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> Réservation soumise avec succès !
        </div>

        <!-- Error Messages -->
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="reservation-section">
            <form th:action="@{/user/reserve}" th:object="${reservationDto}" method="post">
                <!-- Plant Description -->
                <div class="form-group">
                    <label for="plantDescription"><i class="fas fa-leaf"></i> Description de la plante :</label>
                    <input type="text" id="plantDescription" th:field="*{plantDescription}" class="form-control"
                           placeholder="Décrivez la plante dont vous avez besoin">
                    <span th:if="${#fields.hasErrors('plantDescription')}" th:errors="*{plantDescription}" class="text-danger"></span>
                </div>

                <!-- Quantity -->
                <div class="form-group">
                    <label for="quantity"><i class="fas fa-cubes"></i> Quantité :</label>
                    <input type="number" id="quantity" th:field="*{quantity}" class="form-control" min="1" value="1">
                    <span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" class="text-danger"></span>
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName"><i class="fas fa-user"></i> Nom complet :</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                           th:value="${currentUser.username}">
                    <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger"></span>
                </div>

                <!-- Address -->
                <div class="form-group">
                    <label for="address"><i class="fas fa-map-marker-alt"></i> Adresse de livraison :</label>
                    <textarea id="address" th:field="*{address}" class="form-control"
                              placeholder="Votre adresse de livraison complète"></textarea>
                    <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger"></span>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phoneNumber"><i class="fas fa-phone"></i> Numéro de téléphone :</label>
                    <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control"
                           placeholder="Votre numéro de contact">
                    <span th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="text-danger"></span>
                </div>

                <button type="submit" class="btn-reserve">
                    <i class="fas fa-calendar-check"></i> Soumettre la réservation
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
