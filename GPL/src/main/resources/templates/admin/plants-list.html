<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Plantes | GreenPlanet</title>
    <link rel="stylesheet" href="/css/authStyle.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .plants-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .plants-table th, .plants-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .plants-table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .plants-table tr:hover {
            background-color: #f5f5f5;
        }
        .plant-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-success {
            background-color: #28a745;
            color: white;
        }
        .badge-danger {
            background-color: #dc3545;
            color: white;
        }
        .badge-info {
            background-color: #17a2b8;
            color: white;
        }
        .action-btn {
            padding: 5px 10px;
            margin: 0 3px;
            border-radius: 4px;
            font-size: 14px;
        }
        .search-container {
            margin-bottom: 20px;
        }
        .pagination {
            margin-top: 20px;
        }
        .pagination-info {
            margin-top: 10px;
            color: #6c757d;
        }
        .description-cell {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Barre latérale -->
    <div class="sidebar">
        <div class="logo-section">
            <img src="/images/logo.webp" alt="Logo GreenPlanet" class="logo">
            <h2>GreenPlanet</h2>
        </div>
        <nav class="nav-menu">
            <a href="/admin/dashboard">
                <i class="fas fa-tachometer-alt"></i> Tableau de bord
            </a>
            <a href="/admin/plants" class="active">
                <i class="fas fa-leaf"></i> Gestion des plantes
            </a>
            <a href="/admin/reservations">
                <i class="fas fa-calendar-check"></i> Réservations
            </a>
            <a href="/admin/users">
                <i class="fas fa-users"></i> Gestion des utilisateurs
            </a>
            <a th:href="@{/logout}">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </nav>
    </div>

    <!-- Contenu principal -->
    <div class="main-content">
        <header class="dashboard-header">
            <h1><i class="fas fa-leaf"></i> Gestion des plantes</h1>
            <div class="user-info">
                <span th:text="${currentUser.username}"></span>
            </div>
        </header>

        <!-- Messages de succès/erreur -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="content-container">
            <div class="content-header">
                <h2>Liste des plantes</h2>
                <a th:href="@{/admin/plants/add}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Ajouter une plante
                </a>
            </div>

            <!-- Formulaire de recherche -->
            <div class="search-container">
                <form th:action="@{/admin/plants}" method="get" class="search-form">
                    <div class="input-group">
                        <input type="text" class="form-control" name="search"
                               th:value="${search}" placeholder="Rechercher par nom ou catégorie">
                        <input type="hidden" name="page" value="0">
                        <input type="hidden" name="size" th:value="${pageSize}">
                        <button class="btn btn-search" type="submit">
                            <i class="fas fa-search"></i> Rechercher
                        </button>
                        <a th:href="@{/admin/plants}" class="btn btn-clear" th:if="${search}">
                            <i class="fas fa-times"></i> Effacer
                        </a>
                    </div>
                </form>
            </div>

            <!-- Tableau des plantes -->
            <div class="table-responsive">
                <table class="plants-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Nom</th>
                        <th>Catégorie</th>
                        <th>Description</th>
                        <th>Prix</th>
                        <th>Quantité</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="plant : ${plantsPage.content}">
                        <td th:text="${plant.id}"></td>
                        <td>
                            <img th:if="${plant.image_filename}"
                                 th:src="@{'/img/plant_img/' + ${plant.image_filename}}"
                                 class="plant-img" alt="Image de la plante">
                            <span th:unless="${plant.image_filename}" class="text-muted">Aucune image</span>
                        </td>
                        <td th:text="${plant.name}"></td>
                        <td>
                            <span class="badge badge-info" th:text="${plant.category}"></span>
                        </td>
                        <td class="description-cell" th:text="${plant.description}"></td>
                        <td th:text="${#numbers.formatDecimal(plant.price, 1, 2) + ' TND'}"></td>
                        <td>
                            <span th:class="${plant.quantity > 0} ? 'badge badge-success' : 'badge badge-danger'"
                                  th:text="${plant.quantity}"></span>
                        </td>
                        <td>
                            <a th:href="@{'/admin/plants/view/' + ${plant.id}}"
                               class="btn btn-info action-btn" title="Voir">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{'/admin/plants/edit/' + ${plant.id}}"
                               class="btn btn-warning action-btn" title="Modifier">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{'/admin/plants/delete/' + ${plant.id}}"
                               class="btn btn-danger action-btn" title="Supprimer"
                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette plante ?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${plantsPage.content.isEmpty()}">
                        <td colspan="8" class="text-center text-muted">Aucune plante trouvée</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${plantsPage.totalPages > 1}" class="pagination-container">
                <div class="pagination-info">
                    Affichage de <span th:text="${plantsPage.number * plantsPage.size + 1}"></span> à
                    <span th:text="${(plantsPage.number * plantsPage.size) + plantsPage.numberOfElements}"></span> sur
                    <span th:text="${plantsPage.totalElements}"></span> plantes
                </div>

                <nav class="pagination">
                    <a th:href="@{'/admin/plants?(page=0&size=' + ${pageSize} + (${search} ? '&search=' + ${search} : ''))}"
                       class="page-link" th:classappend="${plantsPage.first} ? 'disabled'">
                        <i class="fas fa-angle-double-left"></i>
                    </a>
                    <a th:href="@{'/admin/plants?(page=' + (${plantsPage.number}-1) + '&size=' + ${pageSize} + (${search} ? '&search=' + ${search} : ''))}"
                       class="page-link" th:classappend="${plantsPage.first} ? 'disabled'">
                        <i class="fas fa-angle-left"></i>
                    </a>

                    <a th:each="i : ${#numbers.sequence(0, plantsPage.totalPages-1)}"
                       th:href="@{'/admin/plants?(page=' + ${i} + '&size=' + ${pageSize} + (${search} ? '&search=' + ${search} : ''))}"
                       class="page-link" th:classappend="${i == plantsPage.number} ? 'active'">
                        <span th:text="${i+1}"></span>
                    </a>

                    <a th:href="@{'/admin/plants?(page=' + (${plantsPage.number}+1) + '&size=' + ${pageSize} + (${search} ? '&search=' + ${search} : ''))}"
                       class="page-link" th:classappend="${plantsPage.last} ? 'disabled'">
                        <i class="fas fa-angle-right"></i>
                    </a>
                    <a th:href="@{'/admin/plants?(page=' + (${plantsPage.totalPages}-1) + '&size=' + ${pageSize} + (${search} ? '&search=' + ${search} : ''))}"
                       class="page-link" th:classappend="${plantsPage.last} ? 'disabled'">
                        <i class="fas fa-angle-double-right"></i>
                    </a>
                </nav>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
