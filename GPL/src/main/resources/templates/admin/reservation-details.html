<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails de la Réservation | GreenPlanet</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/authStyle.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .reservation-details-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .reservation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .reservation-status {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 600;
        }

        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-approved { background-color: #d4edda; color: #155724; }
        .status-rejected { background-color: #f8d7da; color: #721c24; }

        .detail-card {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #f9f9f9;
        }

        .detail-row {
            display: flex;
            margin-bottom: 10px;
        }

        .detail-label {
            font-weight: 600;
            width: 150px;
            color: #555;
        }

        .detail-value {
            flex: 1;
        }

        .action-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-section">
            <img src="/images/logo.webp" alt="Logo GreenPlanet" class="logo">
            <h2>GreenPlanet</h2>
        </div>

        <nav class="nav-menu">
            <a href="/admin/dashboard">
                <i class="fas fa-tachometer-alt"></i> Tableau de bord
            </a>
            <a href="/admin/plants">
                <i class="fas fa-leaf"></i> Gestion des plantes
            </a>
            <a href="/admin/reservations">
                <i class="fas fa-calendar-check"></i> Réservations
            </a>
            <a href="/admin/users">
                <i class="fas fa-users"></i> Gestion des utilisateurs
            </a>
            <a th:href="@{/logout}">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="dashboard-header">
            <div class="header-left">
                <h1><i class="fas fa-calendar-check"></i> Détails de la Réservation</h1>
            </div>
            <div class="user-info">
                <span th:text="${currentUser.username}"></span>
            </div>
        </header>

        <!-- Success/Error Messages -->
        <div th:if="${session.succMsg}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${session.succMsg}"></span>
            <button class="close-btn" onclick="this.parentElement.style.display='none'">&times;</button>
        </div>
        <div th:if="${session.errorMsg}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${session.errorMsg}"></span>
            <button class="close-btn" onclick="this.parentElement.style.display='none'">&times;</button>
        </div>

        <div class="reservation-details-container">
            <div class="reservation-header">
                <h2>Réservation n°<span th:text="${reservation.id}"></span></h2>
                <span th:classappend="${reservation.status == 'PENDING'} ? 'reservation-status status-pending' :
                                    (${reservation.status == 'APPROVED'} ? 'reservation-status status-approved' : 'reservation-status status-rejected')"
                      th:text="${reservation.status}"></span>
            </div>

            <div class="detail-card">
                <h3><i class="fas fa-user"></i> Informations Utilisateur</h3>
                <div class="detail-row">
                    <div class="detail-label">Nom :</div>
                    <div class="detail-value" th:text="${reservation.user.username}"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Email :</div>
                    <div class="detail-value" th:text="${reservation.user.email}"></div>
                </div>
            </div>

            <div class="detail-card">
                <h3><i class="fas fa-info-circle"></i> Détails de la Réservation</h3>
                <div class="detail-row">
                    <div class="detail-label">Quantité :</div>
                    <div class="detail-value" th:text="${reservation.quantity}"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Date de Réservation :</div>
                    <div class="detail-value" th:text="${#temporals.format(reservation.reservationDate, 'dd MMMM yyyy')}"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Créé le :</div>
                    <div class="detail-value" th:text="${#temporals.format(reservation.createdAt, 'dd MMMM yyyy HH:mm')}"></div>
                </div>
            </div>

            <div class="action-buttons">
                <a th:if="${reservation.status == 'PENDING'}"
                   th:href="@{'/admin/reservations/approve/' + ${reservation.id}}"
                   class="btn btn-success">
                    <i class="fas fa-check"></i> Approuver
                </a>
                <a th:if="${reservation.status == 'PENDING'}"
                   th:href="@{'/admin/reservations/reject/' + ${reservation.id}}"
                   class="btn btn-danger">
                    <i class="fas fa-times"></i> Rejeter
                </a>
                <a href="/admin/reservations" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Retour aux Réservations
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
