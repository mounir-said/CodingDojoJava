<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenPlanet - Connexion</title>
    <link rel="stylesheet" href="/css/authStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="logo-section">
            <img src="/images/logo.webp" alt="Logo GreenPlanet" class="logo">
            <h1>GreenPlanet</h1>
        </div>

        <!-- Message d'erreur -->
        <div th:if="${param.error}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <th:block th:if="${session.SPRING_SECURITY_LAST_EXCEPTION!=null}">
                [[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]
            </th:block>
            <th:block th:unless="${session.SPRING_SECURITY_LAST_EXCEPTION!=null}">
                Email ou mot de passe invalide
            </th:block>
        </div>

        <!-- Message de succès -->
        <div th:if="${param.logout}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            Vous avez été déconnecté avec succès
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i> Se connecter
            </button>
        </form>

        <div class="auth-footer">
            <p>Vous n'avez pas de compte ? <a th:href="@{/register}">Inscrivez-vous ici</a></p>
        </div>
    </div>
</div>
</body>
</html>
