<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Add Order</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <style>
        /* Set background image for the body */
        body {
            background-image: url('/images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <h1>Add Order</h1>
    <form th:action="@{/orders}" th:object="${order}" method="post">
        <!-- Order Date -->
        <div class="form-group">
            <label for="orderDate">Order Date</label>
            <input type="date" class="form-control" id="orderDate" th:field="*{orderDate}" required>
            <small class="text-danger" th:if="${#fields.hasErrors('orderDate')}" th:errors="*{orderDate}"></small>
        </div>

        <!-- Total Amount -->
        <div class="form-group">
            <label for="totalAmount">Total Amount</label>
            <input type="number" step="0.01" class="form-control" id="totalAmount" th:field="*{totalAmount}" required>
            <small class="text-danger" th:if="${#fields.hasErrors('totalAmount')}" th:errors="*{totalAmount}"></small>
        </div>

        <!-- Customer -->
        <div class="form-group">
            <label for="customer">Customer</label>
            <select class="form-control" id="customer" th:field="*{customer.id}" required>
                <option th:each="customer : ${customers}" th:value="${customer.id}" th:text="${customer.name}"></option>
            </select>
            <small class="text-danger" th:if="${#fields.hasErrors('customer.id')}" th:errors="*{customer.id}"></small>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/orders}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
