<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>View Product</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Optional: Custom CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <style>
        /* Set background image for the body */
        body {
            background-image: url('/images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <h1>View Product</h1>
        <div class="card">
            <div class="card-body">
                <!-- Product Details -->
                <p><strong>ID:</strong> <span th:text="${product.id}"></span></p>
                <p><strong>Name:</strong> <span th:text="${product.name}"></span></p>
                <p><strong>Brand:</strong> <span th:text="${product.brand}"></span></p>
                <p><strong>Category:</strong> <span th:text="${product.category}"></span></p>
                <p><strong>Price:</strong> <span th:text="${product.price} + ' $'"></span></p>
                <p><strong>Description:</strong> <span th:text="${product.description}"></span></p>
                <p><strong>Image:</strong></p>
                <img th:src="@{'/images/' + ${product.image_filename}}" alt="Product Image" width="200" class="img-thumbnail">
                <p><strong>Date of Creation:</strong> <span th:text="${#dates.format(product.created_at, 'yyyy-MM-dd HH:mm')}"></span></p>
            </div>
        </div>
        <!-- Back Button -->
        <div class="mt-3">
            <a th:href="@{/products}" class="btn btn-secondary">Back to List</a>
        </div>
    </div>
</div>

<!-- Bootstrap JS and Popper.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
